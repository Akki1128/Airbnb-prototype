apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: airbnb-lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # IMPORTANT: don't inject Service env vars like KAFKA_PORT
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
          env:
            # Override the cursed KAFKA_PORT env that Confluent hates
            - name: KAFKA_PORT
              value: ""

            # --- Core broker identity ---
            - name: KAFKA_BROKER_ID
              value: "1"

            # --- ZooKeeper connection (your existing service) ---
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"

            # --- Listeners: simple PLAINTEXT listener for in-cluster use ---
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.airbnb-lab2.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # --- Single-broker friendly defaults ---
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # --- Log dir (ephemeral is fine for lab) ---
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: airbnb-lab2
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP

